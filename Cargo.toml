[workspace]
members = [
  "crates/pump-core",
  "crates/pump-cli",
  "components/author",
  "components/runtime",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0 OR MIT"

[workspace.dependencies]
anyhow = "=1.0.100"
clap = { version = "=4.5.53", features = ["derive"] }
hex = "=0.4.3"
proptest = "=1.9.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = { version = "=0.10.9", default-features = false }
thiserror = "=2.0.17"
wasmtime = { version = "=40.0.4", default-features = false, features = ["cranelift", "runtime", "component-model", "std", "wat"] }
wit-bindgen = "=0.53.1"

[workspace.lints.rust]
unsafe_code = "allow"
unused_must_use = "deny"
non_ascii_idents = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
wildcard_enum_match_arm = "deny"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
